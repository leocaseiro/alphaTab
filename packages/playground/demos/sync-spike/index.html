<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>alphaTab — Sync Spike (#2397)</title>
        <link rel="stylesheet" href="../../src/styles/common.css" />
        <style>
            body { margin: 0; font-family: system-ui, sans-serif; }
            .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px; border-bottom: 1px solid #ddd; }
            .bar select, .bar button { font-size: 14px; }
            pre { margin: 0; padding: 8px; max-height: 30vh; overflow: auto; background: #f6f6f6; font-size: 12px; }
            .at-viewport { height: 55vh; overflow: auto; }
        </style>
    </head>
    <body>
        <div class="bar">
            <strong>Sync spike #2397</strong>
            <label>Mode
                <select id="mode">
                    <option value="free">free (no correction)</option>
                    <option value="seek">1 seek on drift</option>
                    <option value="nudge">2 timestamp + nudge</option>
                    <option value="nudgecal">2b nudge + rate calibration</option>
                    <option value="decode">3 decode + mix</option>
                </select>
            </label>
            <label>Audio
                <select id="src">
                    <option value="beeps">generated beeps (measure)</option>
                    <option value="mp3">real MP3 (listen)</option>
                </select>
            </label>
            <label><input type="checkbox" id="listen" /> audible</label>
            <button id="play">Play / Pause</button>
            <label><input type="checkbox" id="metronome" checked /> metronome</label>
            <label><input type="checkbox" id="drums" /> synth drums</label>
            <label>Speed
                <select id="speed">
                    <option>0.5</option>
                    <option>0.75</option>
                    <option selected>1</option>
                    <option>1.25</option>
                    <option>1.5</option>
                </select>
            </label>
            <label>MP3 vol <input type="range" id="mediaVol" min="0" max="1" step="0.05" value="0.35" /></label>
            <label>Synth vol <input type="range" id="synthVol" min="0" max="4" step="0.1" value="2" /></label>
            <button id="measure">Run measurement</button>
        </div>
        <pre id="log">loading…</pre>
        <div class="at-viewport"><div class="at-canvas"></div></div>
        <script type="module" src="./index.ts"></script>
    </body>
</html>
